<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Shore 336 ARPES Temperature Demo</title>
<style>
body{margin:0;background:#f4f6fb;color:#172033;font-family:Arial,Helvetica,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:28px;margin:0}.bar{display:flex;gap:8px;align-items:center}
select,input,button{font:inherit;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;background:white;color:#172033}
button{cursor:pointer;background:#2563eb;color:white;border-color:#2563eb;font-weight:700}
button.secondary{background:#e2e8f0;color:#172033;border-color:#cbd5e1}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:16px 0}
.card,.panel{background:white;border:1px solid #dbe3ef;border-radius:8px;padding:16px}.panel{margin-top:16px}
.label{color:#64748b;font-size:13px}.temp{font-size:46px;font-weight:800;margin-top:6px}.value{font-size:20px;font-weight:800;margin-top:6px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}.controls.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.status{margin-top:14px;color:#475569}.ok{color:#15803d}.bad{color:#b91c1c}.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.good{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
@media(max-width:900px){.grid,.cards,.controls,.controls.three{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<header>
  <h1 data-i18n="title">Lake Shore 336 ARPES Temperature Demo</h1>
  <div class="bar">
    <select id="language" onchange="setLanguage(this.value)"><option value="en">English</option><option value="zh">中文</option></select>
    <button onclick="connect()" data-i18n="connect">Connect Demo</button>
    <button class="secondary" onclick="refresh()" data-i18n="refresh">Refresh</button>
  </div>
</header>
<section class="grid">
  <div class="card"><div class="label" data-i18n="sample">Sample</div><div class="temp"><span id="sample">--</span> K</div></div>
  <div class="card"><div class="label" data-i18n="coldHead">Cold Head</div><div class="temp"><span id="cold_head">--</span> K</div></div>
</section>
<section class="cards">
  <div class="card"><div class="label" data-i18n="setpoint">Setpoint</div><div class="value"><span id="setpoint">--</span> K</div></div>
  <div class="card"><div class="label" data-i18n="ramp">Ramp</div><div class="value" id="ramp_enable">--</div></div>
  <div class="card"><div class="label" data-i18n="rampRate">Ramp Rate</div><div class="value"><span id="ramp_rate">--</span> K/min</div></div>
  <div class="card"><div class="label" data-i18n="heater">Heater</div><div class="value"><span id="heater">--</span> %</div></div>
  <div class="card"><div class="label" data-i18n="comm">Comm</div><div class="value" id="comm">--</div></div>
  <div class="card"><div class="label" data-i18n="stable">Stable</div><div class="value" id="stable_state">--</div></div>
</section>
<section class="panel">
  <h2 data-i18n="control">Temperature Control</h2>
  <div class="controls">
    <label><span data-i18n="setpointK">Setpoint K</span><br><input id="target" value="90" type="number" step="0.1"></label>
    <label><span data-i18n="rampKmin">Ramp K/min</span><br><input id="ramp" value="0.5" type="number" step="0.1"></label>
    <button onclick="setpoint()" data-i18n="applySetpoint">Apply Setpoint</button>
    <button class="secondary" onclick="refresh()" data-i18n="readBack">Read Back</button>
  </div>
</section>
<section class="panel">
  <h2 data-i18n="rhythm">Rhythm Warmup</h2>
  <div class="controls">
    <label><span data-i18n="warmTarget">Warmup Target K</span><br><input id="warm_target" value="100" type="number" step="0.1"></label>
    <label><span data-i18n="stepK">Step K</span><br><input id="step" value="5" type="number" step="0.1"></label>
    <label><span data-i18n="rhythmInterval">Rhythm Interval min</span><br><input id="interval" value="5" type="number" step="0.1"></label>
    <div><button onclick="oneStep()" data-i18n="advance">Advance One Step</button> <button class="secondary" onclick="toggleRhythm()" id="rhythm_button" data-i18n="startRhythm">Start Rhythm</button></div>
  </div>
</section>
<section class="panel">
  <h2 data-i18n="stability">Stability / Hold</h2>
  <div class="controls">
    <label><span data-i18n="stableTol">Stable tolerance K</span><br><input id="stable_tol" value="0.2" type="number" step="0.05"></label>
    <label><span data-i18n="stableMin">Stable duration min</span><br><input id="stable_min" value="2" type="number" step="0.5"></label>
    <label><span data-i18n="holdMin">Hold / soak min</span><br><input id="hold_min" value="10" type="number" step="1"></label>
    <div><button onclick="startHold()" data-i18n="startHold">Start Hold</button> <button class="secondary" onclick="stopHold()" data-i18n="stopHold">Stop Hold</button></div>
  </div>
  <div class="status" id="hold_status" data-i18n="holdReady">Hold is idle.</div>
</section>
<section class="panel">
  <h2 data-i18n="logging">CSV Logging</h2>
  <div class="controls three">
    <button onclick="startLog()" data-i18n="startLog">Start Log</button>
    <button class="secondary" onclick="stopLog()" data-i18n="stopLog">Stop Log</button>
    <button class="secondary" onclick="downloadCsv()" data-i18n="downloadCsv">Download CSV</button>
  </div>
  <div class="status" id="log_status">0 rows</div>
</section>
<section class="panel warn" id="warning_panel"><strong data-i18n="warnings">Safety warnings</strong><div id="warnings">--</div></section>
<section class="panel"><div class="label" data-i18n="instrumentId">Instrument ID</div><div id="idn">--</div><div class="status" id="status" data-i18n="ready">Ready. Connect to demo mode.</div></section>
</main>
<script>
let demo={idn:'DEMO,Lake Shore 336,ARPES-PUBLIC-DEMO,1.0',cold:82.4,sample:84.1,setpoint:90,ramp:0.5,rampOn:true,last:performance.now()};
let timer=null,autoTimer=null,logEnabled=false,logRows=[],lastData={},stableSince=null,holdActive=false,language='en';
const tr={
en:{title:'Lake Shore 336 ARPES Temperature Demo',connect:'Connect Demo',refresh:'Refresh',sample:'Sample',coldHead:'Cold Head',setpoint:'Setpoint',ramp:'Ramp',rampRate:'Ramp Rate',heater:'Heater',comm:'Comm',stable:'Stable',control:'Temperature Control',setpointK:'Setpoint K',rampKmin:'Ramp K/min',applySetpoint:'Apply Setpoint',readBack:'Read Back',rhythm:'Rhythm Warmup',warmTarget:'Warmup Target K',stepK:'Step K',rhythmInterval:'Rhythm Interval min',advance:'Advance One Step',startRhythm:'Start Rhythm',stopRhythm:'Stop Rhythm',stability:'Stability / Hold',stableTol:'Stable tolerance K',stableMin:'Stable duration min',holdMin:'Hold / soak min',startHold:'Start Hold',stopHold:'Stop Hold',holdReady:'Hold is idle.',logging:'CSV Logging',startLog:'Start Log',stopLog:'Stop Log',downloadCsv:'Download CSV',warnings:'Safety warnings',instrumentId:'Instrument ID',ready:'Ready. Connect to demo mode.',updated:'Updated',stableNow:'Stable',notStable:'Not stable',logStarted:'Log running',logStopped:'Log stopped',holdWaiting:'Hold waiting for stable temperature',holdRunning:'Hold running',holdDone:'Hold complete',noWarnings:'No warnings',demoHint:'Public demo mode connected'},
zh:{title:'Lake Shore 336 ARPES 温控演示',connect:'连接演示',refresh:'刷新',sample:'样品温度',coldHead:'冷头温度',setpoint:'设定温度',ramp:'升温开关',rampRate:'升温速率',heater:'加热输出',comm:'通信',stable:'稳定',control:'温度控制',setpointK:'设定温度 K',rampKmin:'升温速率 K/min',applySetpoint:'应用设定',readBack:'读回',rhythm:'节奏升温',warmTarget:'升温目标 K',stepK:'每步 K',rhythmInterval:'节奏间隔 min',advance:'前进一步',startRhythm:'开始节奏',stopRhythm:'停止节奏',stability:'稳定判据 / 保温',stableTol:'稳定容差 K',stableMin:'稳定持续 min',holdMin:'保温 min',startHold:'开始保温',stopHold:'停止保温',holdReady:'保温未启动。',logging:'CSV 日志',startLog:'开始记录',stopLog:'停止记录',downloadCsv:'下载 CSV',warnings:'安全提醒',instrumentId:'仪器 ID',ready:'准备好。连接演示模式。',updated:'已更新',stableNow:'已稳定',notStable:'未稳定',logStarted:'正在记录',logStopped:'记录已停止',holdWaiting:'等待温度稳定后开始保温',holdRunning:'正在保温',holdDone:'保温完成',noWarnings:'没有提醒',demoHint:'公开演示模式已连接'}
};
function number(id){return Number(document.getElementById(id).value)}function t(k){return tr[language][k]||tr.en[k]||k}
function setLanguage(lang){language=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('rhythm_button').textContent=timer?t('stopRhythm'):t('startRhythm');updateStable();updateWarnings();updateHold()}
function showStatus(msg,bad=false){const el=document.getElementById('status');el.textContent=msg;el.className=bad?'status bad':'status ok'}
function simulate(){const now=performance.now(),dt=Math.min(10,(now-demo.last)/1000);demo.last=now;const rate=Math.max(demo.ramp,0.1)/60;for(const key of ['cold','sample']){const lag=key==='sample'?0.65:1;const delta=demo.setpoint-demo[key];const max=rate*dt*lag;demo[key]+=Math.max(-max,Math.min(max,delta))}const heater=Math.min(100,Math.max(0,demo.setpoint-demo.cold)*8+(demo.rampOn?10:0));return{idn:demo.idn,cold_head:demo.cold.toFixed(3),sample:demo.sample.toFixed(3),setpoint:demo.setpoint.toFixed(3),ramp_enable:demo.rampOn?'On':'Off',ramp_rate:demo.ramp.toFixed(3),heater:heater.toFixed(1),comm:'Public Demo',updated:new Date().toLocaleTimeString()}}
function update(data){lastData={...lastData,...data};for(const [k,v] of Object.entries(data)){const el=document.getElementById(k);if(el)el.textContent=v||'--'}updateStable();updateWarnings();updateHold();if(logEnabled)appendLog();if(data.updated)showStatus(t('updated')+' '+data.updated)}
function connect(){update(simulate());showStatus(t('demoHint'));startAutoRefresh()}function refresh(){update(simulate())}
function setpoint(){demo.ramp=number('ramp');demo.rampOn=demo.ramp>0;demo.setpoint=number('target');refresh()}
function oneStep(){demo.ramp=number('ramp');demo.rampOn=demo.ramp>0;demo.setpoint=Math.min(demo.setpoint+number('step'),number('warm_target'));refresh();if(demo.setpoint>=number('warm_target'))stopRhythm()}
function toggleRhythm(){timer?stopRhythm():startRhythm()}function startRhythm(){oneStep();timer=setInterval(oneStep,Math.max(1000,number('interval')*60*1000));document.getElementById('rhythm_button').textContent=t('stopRhythm')}function stopRhythm(){if(timer)clearInterval(timer);timer=null;document.getElementById('rhythm_button').textContent=t('startRhythm')}
function startAutoRefresh(){if(autoTimer)clearInterval(autoTimer);autoTimer=setInterval(refresh,2000)}
function isStable(){const sample=Number(lastData.sample),setp=Number(lastData.setpoint),tol=number('stable_tol');return Number.isFinite(sample)&&Number.isFinite(setp)&&Math.abs(sample-setp)<=tol}
function updateStable(){const el=document.getElementById('stable_state');if(!lastData.sample){el.textContent='--';return}if(isStable()){if(!stableSince)stableSince=Date.now();const mins=(Date.now()-stableSince)/60000;el.textContent=mins>=number('stable_min')?t('stableNow'):mins.toFixed(1)+' min'}else{stableSince=null;el.textContent=t('notStable')}}
function stableLongEnough(){return stableSince&&(Date.now()-stableSince)/60000>=number('stable_min')}
function startHold(){holdActive=true;setpoint();updateHold()}function stopHold(){holdActive=false;delete document.getElementById('hold_status').dataset.start;document.getElementById('hold_status').textContent=t('holdReady')}
function updateHold(){const el=document.getElementById('hold_status');if(!holdActive)return;if(!stableLongEnough()){el.textContent=t('holdWaiting');return}if(!el.dataset.start)el.dataset.start=String(Date.now());const remain=number('hold_min')-(Date.now()-Number(el.dataset.start))/60000;if(remain<=0){holdActive=false;delete el.dataset.start;el.textContent=t('holdDone')}else el.textContent=t('holdRunning')+': '+remain.toFixed(1)+' min left'}
function warnings(){const out=[];const setp=number('target'),ramp=number('ramp'),heater=Number(lastData.heater),sample=Number(lastData.sample);if(setp>350)out.push('Setpoint > 350 K');if(ramp>5)out.push('Ramp > 5 K/min');if(heater>85)out.push('Heater output high: '+heater.toFixed(1)+'%');if(sample>350)out.push('Sample > 350 K');return out}
function updateWarnings(){const items=warnings(),panel=document.getElementById('warning_panel');document.getElementById('warnings').textContent=items.length?items.join('; '):t('noWarnings');panel.className=items.length?'panel warn':'panel good'}
function startLog(){logEnabled=true;document.getElementById('log_status').textContent=t('logStarted')+', '+logRows.length+' rows'}function stopLog(){logEnabled=false;document.getElementById('log_status').textContent=t('logStopped')+', '+logRows.length+' rows'}
function appendLog(){const row=[new Date().toISOString(),lastData.cold_head,lastData.sample,lastData.setpoint,lastData.ramp_enable,lastData.ramp_rate,lastData.heater,lastData.comm,document.getElementById('stable_state').textContent];logRows.push(row);document.getElementById('log_status').textContent=(logEnabled?t('logStarted'):t('logStopped'))+', '+logRows.length+' rows'}
function downloadCsv(){const head=['timestamp','cold_head_K','sample_K','setpoint_K','ramp_enable','ramp_rate_K_per_min','heater_percent','comm','stable_state'];const csv=[head,...logRows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ls336_public_demo_log.csv';a.click();URL.revokeObjectURL(a.href)}
setLanguage('en');
</script>
</body>
</html>
