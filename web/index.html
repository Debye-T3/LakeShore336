<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Shore 336 ARPES Panel</title>
<style>
:root{--bg:#18232b;--panel:#22313b;--panel2:#1c2932;--cyan:#26e6ff;--pink:#ff8fb1;--green:#b6f59e;--yellow:#ffe29a;--text:#e8f4f7;--muted:#91a8b3;--line:#35cde8;--danger:#ff5c7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}main{max-width:1180px;margin:0 auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800;letter-spacing:.5px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;border:1px solid #45616e;border-radius:4px;padding:8px 10px;background:#17252d;color:var(--text)}button{cursor:pointer;background:#276577;border-color:var(--cyan);color:#eaffff;font-weight:800}button.secondary{background:#33454f;color:#e8f4f7;border-color:#59717c}button.danger{background:#5a202d;border-color:var(--danger)}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;box-shadow:0 0 12px rgba(38,230,255,.12)}.status{background:#b8f7a8;color:#17311d;text-align:center;font-size:30px;font-weight:900;border-radius:6px;padding:16px;margin-bottom:12px}.metric{background:var(--panel2);border-left:4px solid var(--cyan);padding:12px;margin:10px 0}.metric.sample{border-left-color:var(--pink)}.label{color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase}.temp{font-size:34px;font-weight:900;margin-top:8px;color:var(--cyan)}.metric.sample .temp{color:var(--pink)}canvas{width:100%;height:260px;background:#253640;border:1px solid #4b6773;border-radius:4px}.section-title{font-size:20px;color:var(--yellow);font-weight:900;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{color:var(--cyan);font-weight:800;font-size:13px}.readback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.readback div{background:var(--panel2);border:1px solid #3d5965;border-radius:4px;padding:10px}.readback strong{display:block;color:var(--green);font-size:21px;margin-top:4px}.pid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.logbox{height:100px;overflow:auto;background:#142027;border:1px solid #3d5965;color:var(--green);padding:10px;font-family:Menlo,Consolas,monospace;font-size:13px}.warning{margin-top:10px;padding:10px;border:1px solid #7e5e26;background:#302815;color:#ffd68a}.ok{color:var(--green)}.bad{color:var(--danger)}@media(max-width:900px){.layout,.grid,.readback{grid-template-columns:1fr}.toolbar{justify-content:flex-start}}
</style>
</head>
<body>
<main>
<header>
  <div class="title" data-i18n="title">Lake Shore 336 ARPES Temp Control</div>
  <div class="toolbar"><select id="language" onchange="setLanguage(this.value)"><option value="en">English</option><option value="zh">中文</option></select><select id="port"></select><button onclick="connect()" data-i18n="connect">CONNECT</button><button class="secondary" onclick="refresh()" data-i18n="refresh">READ</button></div>
</header>
<div class="layout">
  <aside>
    <div class="status" id="connect_state">DISCONNECTED</div>
    <div class="panel">
      <div class="metric"><div class="label" data-i18n="coldHead">Cold Head Temp</div><div class="temp"><span id="cold_head">--</span> K</div></div>
      <div class="metric sample"><div class="label" data-i18n="sample">Sample Stage Temp</div><div class="temp"><span id="sample">--</span> K</div></div>
      <canvas id="chart" width="600" height="260"></canvas>
    </div>
  </aside>
  <section>
    <div class="panel">
      <h2 class="section-title" data-i18n="control">Temperature Control</h2>
      <div class="readback">
        <div><span class="label" data-i18n="setpoint">Setpoint</span><strong><span id="setpoint">--</span> K</strong></div>
        <div><span class="label" data-i18n="rampRate">Ramp</span><strong><span id="ramp_rate">--</span> K/min</strong></div>
        <div><span class="label" data-i18n="heaterRange">Heater Range</span><strong id="heater_range">--</strong></div>
        <div><span class="label" data-i18n="heater">Heater</span><strong><span id="heater">--</span> %</strong></div>
      </div>
      <div class="grid">
        <div class="field"><label data-i18n="setpointK">Setpoint (K)</label><input id="target" type="number" value="90" step="0.1"></div>
        <div class="field"><label data-i18n="rampKmin">Ramp (K/min)</label><input id="ramp" type="number" value="0.5" step="0.1"></div>
        <div class="field"><label data-i18n="heaterRange">Heater Range</label><select id="range"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3" selected>High</option></select></div>
      </div>
      <div class="field" style="margin-top:12px"><label>PID</label><div class="pid"><input id="pid_p" type="number" value="40" step="0.1" placeholder="P"><input id="pid_i" type="number" value="80" step="0.1" placeholder="I"><input id="pid_d" type="number" value="2" step="0.1" placeholder="D"></div></div>
      <div class="actions"><button onclick="applyControl()" data-i18n="apply">APPLY</button><button class="danger" onclick="turnOff()" data-i18n="off">OFF</button><label><input id="enable_ramp" type="checkbox" checked> <span data-i18n="enableRamp">Enable ramp</span></label><span id="stable_state" class="ok">--</span></div>
      <div class="warning" id="warnings">--</div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2 class="section-title" data-i18n="experiment">Experiment Tools</h2>
      <div class="grid">
        <div class="field"><label data-i18n="stepK">Step K</label><input id="step" type="number" value="5" step="0.1"></div>
        <div class="field"><label data-i18n="rhythmInterval">Rhythm min</label><input id="interval" type="number" value="5" step="0.1"></div>
        <div class="field"><label data-i18n="stableTol">Stable ±K</label><input id="stable_tol" type="number" value="0.2" step="0.05"></div>
      </div>
      <div class="actions"><button onclick="oneStep()" data-i18n="advance">STEP</button><button class="secondary" onclick="toggleRhythm()" id="rhythm_button" data-i18n="startRhythm">START RHYTHM</button><button class="secondary" onclick="startLog()" data-i18n="startLog">LOG</button><button class="secondary" onclick="downloadCsv()" data-i18n="downloadCsv">CSV</button></div>
      <div class="logbox" id="system_log"></div>
    </div>
  </section>
</div>
</main>
<script>
let backend=false,timer=null,autoTimer=null,logRows=[],logEnabled=false,lang='en',lastData={},history=[];let demo={cold:82.4,sample:84.1,setpoint:90,ramp:.5,range:3,pid:[40,80,2],last:performance.now()};
const rangeNames=['Off','Low','Medium','High'];
const tr={en:{title:'Lake Shore 336 ARPES Temp Control',connect:'CONNECT',refresh:'READ',coldHead:'Cold Head Temp',sample:'Sample Stage Temp',control:'Temperature Control',setpoint:'Setpoint',rampRate:'Ramp',heaterRange:'Heater Range',heater:'Heater',setpointK:'Setpoint (K)',rampKmin:'Ramp (K/min)',apply:'APPLY',off:'OFF',enableRamp:'Enable ramp',experiment:'Experiment Tools',stepK:'Step K',rhythmInterval:'Rhythm min',stableTol:'Stable ±K',advance:'STEP',startRhythm:'START RHYTHM',stopRhythm:'STOP RHYTHM',startLog:'LOG',downloadCsv:'CSV',connected:'CONNECTED',disconnected:'DISCONNECTED',noWarnings:'No warnings',notStable:'Not stable',stable:'Stable'},zh:{title:'Lake Shore 336 ARPES 温控',connect:'连接',refresh:'读取',coldHead:'冷头温度',sample:'样品台温度',control:'温度控制',setpoint:'设定温度',rampRate:'升温速率',heaterRange:'加热档位',heater:'加热输出',setpointK:'设定温度 (K)',rampKmin:'升温速率 (K/min)',apply:'应用',off:'关闭',enableRamp:'启用升温',experiment:'实验工具',stepK:'每步 K',rhythmInterval:'节奏 min',stableTol:'稳定 ±K',advance:'前进一步',startRhythm:'开始节奏',stopRhythm:'停止节奏',startLog:'记录',downloadCsv:'CSV',connected:'已连接',disconnected:'未连接',noWarnings:'无警告',notStable:'未稳定',stable:'已稳定'}};
function t(k){return tr[lang][k]||tr.en[k]||k}function number(id){return Number(document.getElementById(id).value)}function setLanguage(v){lang=v;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById('rhythm_button').textContent=timer?t('stopRhythm'):t('startRhythm');document.getElementById('connect_state').textContent=lastData.comm?t('connected'):t('disconnected');updateWarnings()}
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok)throw new Error((await res.json()).error||res.statusText);return res.json()}
function log(m){const el=document.getElementById('system_log');el.innerHTML='['+new Date().toLocaleTimeString()+'] '+m+'<br>'+el.innerHTML}
async function loadPorts(){try{const d=await api('/api/ports');backend=true;fillPorts(d.ports)}catch{backend=false;fillPorts(['DEMO'])}}function fillPorts(ports){const s=document.getElementById('port');s.innerHTML='';ports.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;s.appendChild(o)})}
async function connect(){try{const d=backend?await api('/api/connect',{port:document.getElementById('port').value}):simulate();update(d);document.getElementById('connect_state').textContent=t('connected');startAuto();log('CONNECTED')}catch(e){log('ERROR '+e.message)}}
async function refresh(){try{update(backend?await api('/api/read'):simulate())}catch(e){log('ERROR '+e.message)}}
async function applyControl(){const body={target:number('target'),ramp:document.getElementById('enable_ramp').checked?number('ramp'):0,range:Number(document.getElementById('range').value),pid_p:number('pid_p'),pid_i:number('pid_i'),pid_d:number('pid_d')};try{update(backend?await api('/api/control',body):demoControl(body));log('APPLY setpoint='+body.target+' range='+rangeNames[body.range]+' PID='+body.pid_p+','+body.pid_i+','+body.pid_d)}catch(e){log('ERROR '+e.message)}}
function turnOff(){document.getElementById('range').value='0';document.getElementById('enable_ramp').checked=false;applyControl()}
function oneStep(){document.getElementById('target').value=Math.min(number('target')+number('step'),350);applyControl()}function toggleRhythm(){if(timer){clearInterval(timer);timer=null;document.getElementById('rhythm_button').textContent=t('startRhythm')}else{oneStep();timer=setInterval(oneStep,Math.max(1000,number('interval')*60000));document.getElementById('rhythm_button').textContent=t('stopRhythm')}}
function demoControl(b){demo.setpoint=b.target;demo.ramp=b.ramp;demo.range=b.range;demo.pid=[b.pid_p,b.pid_i,b.pid_d];return simulate()}function simulate(){const now=performance.now(),dt=Math.min(10,(now-demo.last)/1000);demo.last=now;const r=Math.max(demo.ramp,.1)/60;for(const k of ['cold','sample']){const lag=k==='sample'?.65:1,delta=demo.setpoint-demo[k],max=r*dt*lag;demo[k]+=Math.max(-max,Math.min(max,delta))}const heater=demo.range===0?0:Math.min(100,Math.max(0,demo.setpoint-demo.cold)*8+demo.range*8);return{idn:'DEMO,Lake Shore 336,ARPES,1.0',cold_head:demo.cold.toFixed(3),sample:demo.sample.toFixed(3),setpoint:demo.setpoint.toFixed(3),ramp_rate:demo.ramp.toFixed(3),heater_range:rangeNames[demo.range],heater_range_raw:String(demo.range),pid_p:String(demo.pid[0]),pid_i:String(demo.pid[1]),pid_d:String(demo.pid[2]),heater:heater.toFixed(1),comm:'Demo',updated:new Date().toLocaleTimeString()}}
function update(d){lastData={...lastData,...d};['cold_head','sample','setpoint','ramp_rate','heater','heater_range'].forEach(k=>{const el=document.getElementById(k);if(el)el.textContent=d[k]??lastData[k]??'--'});if(d.heater_range_raw)document.getElementById('range').value=d.heater_range_raw;if(d.pid_p)document.getElementById('pid_p').value=d.pid_p;if(d.pid_i)document.getElementById('pid_i').value=d.pid_i;if(d.pid_d)document.getElementById('pid_d').value=d.pid_d;history.push({t:new Date(),cold:Number(lastData.cold_head),sample:Number(lastData.sample)});history=history.slice(-80);drawChart();updateStable();updateWarnings();if(logEnabled)appendLog()}
function updateStable(){const stable=Math.abs(Number(lastData.sample)-Number(lastData.setpoint))<=number('stable_tol');document.getElementById('stable_state').textContent=lastData.sample?(stable?t('stable'):t('notStable')):'--';document.getElementById('stable_state').className=stable?'ok':'bad'}
function updateWarnings(){const w=[];if(number('target')>350)w.push('Setpoint > 350 K');if(number('ramp')>5)w.push('Ramp > 5 K/min');if(Number(lastData.heater)>85)w.push('Heater high '+lastData.heater+'%');document.getElementById('warnings').textContent=w.length?w.join('; '):t('noWarnings')}
function drawChart(){const c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#3e5965';for(let i=0;i<5;i++){let y=20+i*50;x.beginPath();x.moveTo(40,y);x.lineTo(580,y);x.stroke()}function line(key,color){x.strokeStyle=color;x.lineWidth=3;x.beginPath();history.forEach((p,i)=>{let xx=40+i*(540/Math.max(1,history.length-1)),yy=230-(p[key]-20)*3;if(i)x.lineTo(xx,yy);else x.moveTo(xx,yy)});x.stroke()}line('cold','#26e6ff');line('sample','#ff8fb1');x.fillStyle='#e8f4f7';x.fillText('Cold Head / Sample',45,24)}
function startAuto(){if(autoTimer)clearInterval(autoTimer);autoTimer=setInterval(refresh,2000)}function startLog(){logEnabled=!logEnabled;log(logEnabled?'LOG START':'LOG STOP')}function appendLog(){logRows.push([new Date().toISOString(),lastData.cold_head,lastData.sample,lastData.setpoint,lastData.ramp_rate,lastData.heater_range,lastData.heater,lastData.pid_p,lastData.pid_i,lastData.pid_d])}function downloadCsv(){const head=['timestamp','cold_head_K','sample_K','setpoint_K','ramp_K_min','heater_range','heater_percent','pid_p','pid_i','pid_d'];const csv=[head,...logRows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ls336_arpes_log.csv';a.click();URL.revokeObjectURL(a.href)}
loadPorts();setLanguage('en');
</script>
</body>
</html>
