<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Shore 336 ARPES Panel</title>
<style>
:root{--bg:#18232b;--panel:#22313b;--panel2:#1c2932;--cyan:#26e6ff;--pink:#ff8fb1;--green:#b6f59e;--yellow:#ffe29a;--text:#e8f4f7;--muted:#91a8b3;--line:#35cde8;--danger:#ff5c7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}main{max-width:1180px;margin:0 auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800;letter-spacing:.5px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;border:1px solid #45616e;border-radius:4px;padding:8px 10px;background:#17252d;color:var(--text)}button{cursor:pointer;background:#276577;border-color:var(--cyan);color:#eaffff;font-weight:800}button.secondary{background:#33454f;color:#e8f4f7;border-color:#59717c}button.danger{background:#5a202d;border-color:var(--danger)}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;box-shadow:0 0 12px rgba(38,230,255,.12)}.status{background:#b8f7a8;color:#17311d;text-align:center;font-size:30px;font-weight:900;border-radius:6px;padding:16px;margin-bottom:12px}.metric{background:var(--panel2);border-left:4px solid var(--cyan);padding:12px;margin:10px 0}.metric.sample{border-left-color:var(--pink)}.label{color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase}.temp{font-size:34px;font-weight:900;margin-top:8px;color:var(--cyan)}.metric.sample .temp{color:var(--pink)}.chart-wrap{background:#21313b;border:1px solid #5f7b86;border-radius:4px;margin-top:12px;padding:10px}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#cfe9ef;font-size:13px;font-weight:800;margin-bottom:8px}.legend{display:flex;gap:10px;color:#b8cbd2;font-size:12px}.swatch{display:inline-block;width:18px;height:4px;border-radius:8px;margin-right:5px;vertical-align:middle}.cold{background:var(--cyan)}.sample-line{background:var(--pink)}canvas{display:block;width:100%;height:300px;background:#253640;border:1px solid #4b6773;border-radius:4px}.section-title{font-size:20px;color:var(--yellow);font-weight:900;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{color:var(--cyan);font-weight:800;font-size:13px}.readback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.readback div{background:var(--panel2);border:1px solid #3d5965;border-radius:4px;padding:10px}.readback strong{display:block;color:var(--green);font-size:21px;margin-top:4px}.pid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.logbox{height:100px;overflow:auto;background:#142027;border:1px solid #3d5965;color:var(--green);padding:10px;font-family:Menlo,Consolas,monospace;font-size:13px}.warning{margin-top:10px;padding:10px;border:1px solid #7e5e26;background:#302815;color:#ffd68a}.ok{color:var(--green)}.bad{color:var(--danger)}@media(max-width:900px){.layout,.grid,.readback{grid-template-columns:1fr}.toolbar{justify-content:flex-start}}
</style>
</head>
<body>
<main>
<header>
  <div class="title" data-i18n="title">Lake Shore 336 ARPES Temp Control</div>
  <div class="toolbar"><select id="language" onchange="setLanguage(this.value)"><option value="en">English</option><option value="zh">中文</option></select><select id="port"></select><button onclick="connect()" data-i18n="connect">CONNECT</button><button class="secondary" onclick="refresh()" data-i18n="refresh">READ</button></div>
</header>
<div class="layout">
  <aside>
    <div class="status" id="connect_state">DISCONNECTED</div>
    <div class="panel">
      <div class="metric"><div class="label"><span data-i18n="coldHead">Cold Head Temp</span> <span id="cold_input_badge">A</span></div><div class="temp"><span id="cold_head">--</span> K</div></div>
      <div class="metric sample"><div class="label"><span data-i18n="sample">Sample Stage Temp</span> <span id="sample_input_badge">B</span></div><div class="temp"><span id="sample">--</span> K</div></div>
      <div class="chart-wrap">
        <div class="chart-title"><span data-i18n="trend">Temperature Trend</span><span class="legend"><span><i class="swatch cold"></i>Cold Head</span><span><i class="swatch sample-line"></i>Sample</span></span></div>
        <canvas id="chart" width="640" height="320"></canvas>
      </div>
    </div>
  </aside>
  <section>
    <div class="panel">
      <h2 class="section-title" data-i18n="control">Temperature Control</h2>
      <div class="readback">
        <div><span class="label" data-i18n="setpoint">Setpoint</span><strong><span id="setpoint">--</span> K</strong></div>
        <div><span class="label" data-i18n="rampRate">Ramp</span><strong><span id="ramp_rate">--</span> K/min</strong></div>
        <div><span class="label" data-i18n="heaterRange">Heater Range</span><strong id="heater_range">--</strong></div>
        <div><span class="label" data-i18n="heater">Heater</span><strong><span id="heater">--</span> %</strong></div>
      </div>
      <div class="readback">
        <div><span class="label" data-i18n="inputA">Input A</span><strong><span id="input_a">--</span> K</strong></div>
        <div><span class="label" data-i18n="inputB">Input B</span><strong><span id="input_b">--</span> K</strong></div>
        <div><span class="label" data-i18n="inputC">Input C</span><strong><span id="input_c">--</span> K</strong></div>
        <div><span class="label" data-i18n="inputD">Input D</span><strong><span id="input_d">--</span> K</strong></div>
      </div>
      <div class="grid">
        <div class="field"><label data-i18n="coldInput">Cold Input</label><select id="cold_input" onchange="applyInputs()"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
        <div class="field"><label data-i18n="sampleInput">Sample Input</label><select id="sample_input" onchange="applyInputs()"><option>A</option><option value="B" selected>B</option><option>C</option><option>D</option></select></div>
        <div class="field"><label data-i18n="controlInput">Control Input</label><select id="control_input" onchange="applyInputs()"><option>A</option><option value="B" selected>B</option><option>C</option><option>D</option></select></div>
        <div class="field"><label data-i18n="setpointK">Setpoint (K)</label><input id="target" type="number" value="90" step="0.1"></div>
        <div class="field"><label data-i18n="rampKmin">Ramp (K/min)</label><input id="ramp" type="number" value="0.5" step="0.1"></div>
        <div class="field"><label data-i18n="heaterRange">Heater Range</label><select id="range"><option value="0">Off</option><option value="1">Low</option><option value="2">Medium</option><option value="3" selected>High</option></select></div>
      </div>
      <div class="field" style="margin-top:12px"><label>PID</label><div class="pid"><input id="pid_p" type="number" value="40" step="0.1" placeholder="P"><input id="pid_i" type="number" value="80" step="0.1" placeholder="I"><input id="pid_d" type="number" value="2" step="0.1" placeholder="D"></div></div>
      <div class="actions"><button onclick="applyControl()" data-i18n="apply">APPLY</button><button class="danger" onclick="turnOff()" data-i18n="off">OFF</button><label><input id="enable_ramp" type="checkbox" checked> <span data-i18n="enableRamp">Enable ramp</span></label><span id="stable_state" class="ok">--</span></div>
      <div class="warning" id="warnings">--</div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2 class="section-title" data-i18n="experiment">Experiment Tools</h2>
      <div class="grid">
        <div class="field"><label data-i18n="stepK">Step K</label><input id="step" type="number" value="5" step="0.1"></div>
        <div class="field"><label data-i18n="rhythmInterval">Rhythm min</label><input id="interval" type="number" value="5" step="0.1"></div>
        <div class="field"><label data-i18n="stableTol">Stable ±K</label><input id="stable_tol" type="number" value="0.2" step="0.05"></div>
      </div>
      <div class="actions"><button onclick="oneStep()" data-i18n="advance">STEP</button><button class="secondary" onclick="toggleRhythm()" id="rhythm_button" data-i18n="startRhythm">START RHYTHM</button><button class="secondary" onclick="startLog()" data-i18n="startLog">LOG</button><button class="secondary" onclick="downloadCsv()" data-i18n="downloadCsv">CSV</button></div>
      <div class="logbox" id="system_log"></div>
    </div>
  </section>
</div>
</main>
<script>
let backend=false,timer=null,autoTimer=null,logRows=[],logEnabled=false,lang='en',lastData={},history=[];
let editingInputs=new Set();
let demo={inputs:{A:82.4,B:84.1,C:296,D:296},coldInput:'A',sampleInput:'B',controlInput:'B',setpoint:90,ramp:.5,range:3,pid:[40,80,2],last:performance.now()};
const rangeNames=['Off','Low','Medium','High'];
const tr={en:{title:'Lake Shore 336 ARPES Temp Control',connect:'CONNECT',refresh:'READ',coldHead:'Cold Head Temp',sample:'Sample Stage Temp',trend:'Temperature Trend',control:'Temperature Control',setpoint:'Setpoint',rampRate:'Ramp',heaterRange:'Heater Range',heater:'Heater',inputA:'Input A',inputB:'Input B',inputC:'Input C',inputD:'Input D',coldInput:'Cold Input',sampleInput:'Sample Input',controlInput:'Control Input',setpointK:'Setpoint (K)',rampKmin:'Ramp (K/min)',apply:'APPLY',off:'OFF',enableRamp:'Enable ramp',experiment:'Experiment Tools',stepK:'Step K',rhythmInterval:'Rhythm min',stableTol:'Stable ±K',advance:'STEP',startRhythm:'START RHYTHM',stopRhythm:'STOP RHYTHM',startLog:'LOG',downloadCsv:'CSV',connected:'CONNECTED',disconnected:'DISCONNECTED',noWarnings:'No warnings',notStable:'Not stable',stable:'Stable'},zh:{title:'Lake Shore 336 ARPES 温控',connect:'连接',refresh:'读取',coldHead:'冷头温度',sample:'样品台温度',trend:'温度趋势',control:'温度控制',setpoint:'设定温度',rampRate:'升温速率',heaterRange:'加热档位',heater:'加热输出',inputA:'Input A',inputB:'Input B',inputC:'Input C',inputD:'Input D',coldInput:'冷头 Input',sampleInput:'样品 Input',controlInput:'控温 Input',setpointK:'设定温度 (K)',rampKmin:'升温速率 (K/min)',apply:'应用',off:'关闭',enableRamp:'启用升温',experiment:'实验工具',stepK:'每步 K',rhythmInterval:'节奏 min',stableTol:'稳定 ±K',advance:'前进一步',startRhythm:'开始节奏',stopRhythm:'停止节奏',startLog:'记录',downloadCsv:'CSV',connected:'已连接',disconnected:'未连接',noWarnings:'无警告',notStable:'未稳定',stable:'已稳定'}};
function t(k){return tr[lang][k]||tr.en[k]||k}function number(id){return Number(document.getElementById(id).value)}function setLanguage(v){lang=v;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById('rhythm_button').textContent=timer?t('stopRhythm'):t('startRhythm');document.getElementById('connect_state').textContent=lastData.comm?t('connected'):t('disconnected');updateWarnings()}
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok)throw new Error((await res.json()).error||res.statusText);return res.json()}
function log(m){const el=document.getElementById('system_log');el.innerHTML='['+new Date().toLocaleTimeString()+'] '+m+'<br>'+el.innerHTML}
async function loadPorts(){try{const d=await api('/api/ports');backend=true;fillPorts(d.ports)}catch{backend=false;fillPorts(['DEMO'])}}function fillPorts(ports){const s=document.getElementById('port');s.innerHTML='';ports.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;s.appendChild(o)})}
async function connect(){try{const d=backend?await api('/api/connect',{port:document.getElementById('port').value}):simulate();update(d);document.getElementById('connect_state').textContent=t('connected');startAuto();log('CONNECTED')}catch(e){log('ERROR '+e.message)}}
async function refresh(){try{update(backend?await api('/api/read'):simulate())}catch(e){log('ERROR '+e.message)}}
function inputBody(){return{cold_input:document.getElementById('cold_input').value,sample_input:document.getElementById('sample_input').value,control_input:document.getElementById('control_input').value}}
async function applyInputs(){const body=inputBody();try{update(backend?await api('/api/inputs',body):demoInputs(body));log('INPUTS cold='+body.cold_input+' sample='+body.sample_input+' control='+body.control_input)}catch(e){log('ERROR '+e.message)}}
async function applyControl(){const body={...inputBody(),target:number('target'),ramp:document.getElementById('enable_ramp').checked?number('ramp'):0,range:Number(document.getElementById('range').value),pid_p:number('pid_p'),pid_i:number('pid_i'),pid_d:number('pid_d')};try{update(backend?await api('/api/control',body):demoControl(body));log('APPLY setpoint='+body.target+' control='+body.control_input+' range='+rangeNames[body.range]+' PID='+body.pid_p+','+body.pid_i+','+body.pid_d)}catch(e){log('ERROR '+e.message)}}
function turnOff(){document.getElementById('range').value='0';document.getElementById('enable_ramp').checked=false;applyControl()}
function oneStep(){document.getElementById('target').value=Math.min(number('target')+number('step'),350);applyControl()}function toggleRhythm(){if(timer){clearInterval(timer);timer=null;document.getElementById('rhythm_button').textContent=t('startRhythm')}else{oneStep();timer=setInterval(oneStep,Math.max(1000,number('interval')*60000));document.getElementById('rhythm_button').textContent=t('stopRhythm')}}
function demoInputs(b){demo.coldInput=b.cold_input;demo.sampleInput=b.sample_input;demo.controlInput=b.control_input||b.sample_input;return simulate()}
function demoControl(b){demoInputs(b);demo.setpoint=b.target;demo.ramp=b.ramp;demo.range=b.range;demo.pid=[b.pid_p,b.pid_i,b.pid_d];return simulate()}function simulate(){const now=performance.now(),dt=Math.min(10,(now-demo.last)/1000);demo.last=now;const r=Math.max(demo.ramp,.1)/60;for(const ch of ['A','B']){const lag=ch===demo.controlInput?1:.65,delta=demo.setpoint-demo.inputs[ch],max=r*dt*lag;demo.inputs[ch]+=Math.max(-max,Math.min(max,delta))}const controlTemp=demo.inputs[demo.controlInput]??demo.inputs.B;const heater=demo.range===0?0:Math.min(100,Math.max(0,demo.setpoint-controlTemp)*8+demo.range*8);return{idn:'DEMO,Lake Shore 336,ARPES,1.0',cold_head:demo.inputs[demo.coldInput].toFixed(3),sample:demo.inputs[demo.sampleInput].toFixed(3),input_a:demo.inputs.A.toFixed(3),input_b:demo.inputs.B.toFixed(3),input_c:demo.inputs.C.toFixed(3),input_d:demo.inputs.D.toFixed(3),cold_input:demo.coldInput,sample_input:demo.sampleInput,control_input:demo.controlInput,setpoint:demo.setpoint.toFixed(3),ramp_rate:demo.ramp.toFixed(3),heater_range:rangeNames[demo.range],heater_range_raw:String(demo.range),pid_p:String(demo.pid[0]),pid_i:String(demo.pid[1]),pid_d:String(demo.pid[2]),heater:heater.toFixed(1),comm:'Demo',updated:new Date().toLocaleTimeString()}}
function setIfNotEditing(id,value){const el=document.getElementById(id);if(el&&!editingInputs.has(id))el.value=value}
function update(d){lastData={...lastData,...d};['cold_head','sample','setpoint','ramp_rate','heater','heater_range','input_a','input_b','input_c','input_d'].forEach(k=>{const el=document.getElementById(k);if(el)el.textContent=d[k]??lastData[k]??'--'});if(d.cold_input){setIfNotEditing('cold_input',d.cold_input);document.getElementById('cold_input_badge').textContent=d.cold_input}if(d.sample_input){setIfNotEditing('sample_input',d.sample_input);document.getElementById('sample_input_badge').textContent=d.sample_input}if(d.control_input)setIfNotEditing('control_input',d.control_input);if(d.heater_range_raw)setIfNotEditing('range',d.heater_range_raw);if(d.pid_p)setIfNotEditing('pid_p',d.pid_p);if(d.pid_i)setIfNotEditing('pid_i',d.pid_i);if(d.pid_d)setIfNotEditing('pid_d',d.pid_d);history.push({t:new Date(),cold:Number(lastData.cold_head),sample:Number(lastData.sample)});history=history.slice(-80);drawChart();updateStable();updateWarnings();if(logEnabled)appendLog()}
function updateStable(){const stable=Math.abs(Number(lastData.sample)-Number(lastData.setpoint))<=number('stable_tol');document.getElementById('stable_state').textContent=lastData.sample?(stable?t('stable'):t('notStable')):'--';document.getElementById('stable_state').className=stable?'ok':'bad'}
function updateWarnings(){const w=[];if(number('target')>350)w.push('Setpoint > 350 K');if(number('ramp')>10)w.push('Ramp > 10 K/min');if(Number(lastData.heater)>85)w.push('Heater high '+lastData.heater+'%');document.getElementById('warnings').textContent=w.length?w.join('; '):t('noWarnings')}
function drawChart(){const c=document.getElementById('chart'),x=c.getContext('2d'),w=c.width,h=c.height,p={l:58,r:18,t:22,b:38};x.clearRect(0,0,w,h);x.font='13px Arial';x.textBaseline='middle';x.lineWidth=1;const vals=history.flatMap(v=>[v.cold,v.sample]).filter(Number.isFinite);if(!vals.length){x.fillStyle='#b8cbd2';x.fillText('Connect DEMO or instrument to start plotting',p.l,p.t+20);return}let min=Math.min(...vals),max=Math.max(...vals);const span=Math.max(2,max-min),pad=Math.max(1,span*.25);min=Math.floor(min-pad);max=Math.ceil(max+pad);function sx(i){return p.l+i*((w-p.l-p.r)/Math.max(1,history.length-1))}function sy(v){return h-p.b-(v-min)*((h-p.t-p.b)/(max-min))}x.strokeStyle='rgba(207,233,239,.24)';x.fillStyle='#b8cbd2';for(let i=0;i<=4;i++){const v=min+(max-min)*(i/4),y=sy(v);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v.toFixed(1)+' K',8,y)}x.strokeStyle='rgba(207,233,239,.55)';x.beginPath();x.moveTo(p.l,p.t);x.lineTo(p.l,h-p.b);x.lineTo(w-p.r,h-p.b);x.stroke();x.fillStyle='#cfe9ef';x.fillText('Temp (K)',p.l,p.t-8);const start=history[0].t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),end=history[history.length-1].t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});x.fillText(start,p.l,h-16);x.textAlign='right';x.fillText(end,w-p.r,h-16);x.textAlign='left';function line(key,color,labelOffset){x.strokeStyle=color;x.lineWidth=4;x.lineJoin='round';x.lineCap='round';x.beginPath();history.forEach((point,i)=>{const xx=sx(i),yy=sy(point[key]);if(i)x.lineTo(xx,yy);else x.moveTo(xx,yy)});x.stroke();const last=history[history.length-1],lx=sx(history.length-1),ly=sy(last[key]);x.fillStyle=color;x.beginPath();x.arc(lx,ly,5,0,Math.PI*2);x.fill();x.font='bold 13px Arial';x.fillText(last[key].toFixed(2)+' K',Math.max(p.l,lx-88),Math.max(p.t+10,ly+labelOffset))}line('cold','#26e6ff',-14);line('sample','#ff8fb1',18)}
function startAuto(){if(autoTimer)clearInterval(autoTimer);autoTimer=setInterval(refresh,2000)}function startLog(){logEnabled=!logEnabled;log(logEnabled?'LOG START':'LOG STOP')}function appendLog(){logRows.push([new Date().toISOString(),lastData.cold_input,lastData.sample_input,lastData.control_input,lastData.cold_head,lastData.sample,lastData.input_a,lastData.input_b,lastData.input_c,lastData.input_d,lastData.setpoint,lastData.ramp_rate,lastData.heater_range,lastData.heater,lastData.pid_p,lastData.pid_i,lastData.pid_d])}function downloadCsv(){const head=['timestamp','cold_input','sample_input','control_input','cold_head_K','sample_K','input_a_K','input_b_K','input_c_K','input_d_K','setpoint_K','ramp_K_min','heater_range','heater_percent','pid_p','pid_i','pid_d'];const csv=[head,...logRows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ls336_arpes_log.csv';a.click();URL.revokeObjectURL(a.href)}
['target','ramp','range','pid_p','pid_i','pid_d','step','interval','stable_tol','cold_input','sample_input','control_input'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('focus',()=>editingInputs.add(id));
  el.addEventListener('input',()=>editingInputs.add(id));
  el.addEventListener('change',()=>editingInputs.add(id));
  el.addEventListener('blur',()=>setTimeout(()=>editingInputs.delete(id),3000));
});
loadPorts();setLanguage('en');
</script>
</body>
</html>
