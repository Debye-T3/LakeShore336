Terminator = CR LF;
ReplyTimeout = 2000;
ReadTimeout = 2000;
ExtraInput = Ignore;

getIDN {
    out "*IDN?";
    in "%39c";
}

getTemperature {
    out "KRDG? \$1";
    in "%f";
}

getControlInput {
    out "OUTMODE? 1";
    in "%*d,%d,%*d";
}

getSetpoint {
    out "SETP? 1";
    in "%f";
}

setSetpoint {
    out "SETP 1,%f";
}

getRampEnable {
    out "RAMP? 1";
    in "%d,%*f";
}

getRampRate {
    out "RAMP? 1";
    in "%*d,%f";
}

setRampRate {
    out "RAMP? 1";
    in "%(\$1Loop1:RAMP:ENABLE:CACHE.VAL)d,%*f";
    out "RAMP 1,%(\$1Loop1:RAMP:ENABLE:CACHE.VAL)d,%f";
}

setRampEnable {
    out "RAMP? 1";
    in "%*d,%(\$1Loop1:RAMP:RATE:CACHE.VAL)f";
    out "RAMP 1,%d,%(\$1Loop1:RAMP:RATE:CACHE.VAL)f";
}

getRange {
    out "RANGE? 1";
    in "%d";
}

setRange {
    out "RANGE 1,%d";
}

getHeater {
    out "HTR? 1";
    in "%f";
}

getPidP {
    out "PID? 1";
    in "%f,%*f,%*f";
}

getPidI {
    out "PID? 1";
    in "%*f,%f,%*f";
}

getPidD {
    out "PID? 1";
    in "%*f,%*f,%f";
}
